# =============================================================================
# Pixel Maze GB
# File:        .github/workflows/ci.yml
# Description: CI/CD pipeline. Builds the ROM inside the same hermetic dev
#              container used locally (tools/container/Dockerfile), runs the
#              test suite, verifies the build is reproducible, uploads the
#              ROM as a workflow artifact, and (on main) publishes the dev
#              container image to GHCR.
#
# Copyright (C) 2026 Oasis Loop Labs
#
# SPDX-License-Identifier: GPL-2.0-only
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEV_IMAGE: p-maze-gb-dev:ci

jobs:
  build-and-test:
    name: Build ROM and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build dev container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tools/container/Dockerfile
          tags: ${{ env.DEV_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container toolchain
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            ${{ env.DEV_IMAGE }} bash tests/container/test-tools.sh

      - name: Lint workflows and shell scripts
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            ${{ env.DEV_IMAGE }} actionlint
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            ${{ env.DEV_IMAGE }} shellcheck dev tests/container/test-tools.sh

      - name: Build ROM
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            ${{ env.DEV_IMAGE }} make all

      - name: Run unit tests (ROM boot smoke, DMG/GBC detection, gameplay solve, binjgb visual smoke)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            ${{ env.DEV_IMAGE }} python3 -m pytest tests/test_rom_boot.py tests/test_gameplay.py tests/test_binjgb_smoke.py -v

      - name: Run non-regression tests (20-level endurance run)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            ${{ env.DEV_IMAGE }} python3 -m pytest tests/test_endurance.py -v

      - name: Verify reproducible build
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            ${{ env.DEV_IMAGE }} make reproducible

      - name: Upload ROM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p-maze-gb-rom-${{ github.sha }}
          path: |
            build/p-maze-gb.gb
            build/p-maze-gb.sym
            build/p-maze-gb.map
          if-no-files-found: error
          retention-days: 30

  publish-dev-image:
    name: Publish dev container image to GHCR
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tools/container/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/p-maze-gb-dev:latest
            ghcr.io/${{ github.repository_owner }}/p-maze-gb-dev:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
