services:
  dev:
    build:
      context: .
      dockerfile: tools/container/Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"

  ci:
    build:
      context: .
      dockerfile: tools/container/Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    command: make check

  shell:
    build:
      context: .
      dockerfile: tools/container/Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    entrypoint: /bin/bash
